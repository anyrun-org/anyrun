[package]
name = "anyrun-provider"
version = "25.12.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
anyrun-interface.workspace = true
anyrun-provider-ipc = { path = "./anyrun-provider-ipc" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
futures = "0.3.31"
chrono = { features = ["serde"], version = "0.4.42" }
serde = { features = ["derive"], version = "1.0.228" }
serde_json = "1.0.148"
notify = "8"
notify-debouncer-mini = "0.6"
bincode = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "anyrun-provider"
path = "src/main.rs"

[lib]
name = "anyrun_provider"
path = "src/lib.rs"
